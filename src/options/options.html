<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinTap Options</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e5e7eb;
      }
      h1,
      h2 {
        margin: 0 0 12px;
      }
      section {
        background: #111827;
        border: 1px solid #243045;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(340px, 1fr) 260px;
        gap: 18px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      label {
        min-width: 140px;
      }
      input,
      select,
      button {
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 6px 8px;
      }
      .btn-danger {
        border-color: #7f1d1d;
        color: #fecaca;
        background: #3f0f13;
        min-width: 74px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
      }
      .btn-danger:hover {
        background: #5b151b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid #243045;
        text-align: left;
        padding: 8px 6px;
        vertical-align: middle;
      }
      .status {
        color: #93c5fd;
        min-height: 20px;
      }
      .value {
        width: 68px;
        color: #cbd5e1;
        text-align: right;
      }
      .color-field {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .color-picker {
        width: 38px;
        height: 32px;
        padding: 2px;
      }
      .color-input {
        width: 120px;
        text-transform: uppercase;
      }
      .preview-panel {
        border: 1px dashed #334155;
        border-radius: 12px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 20%, #1f2937, #0f172a);
      }
      .preview-marker {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid rgba(96, 165, 250, 0.85);
        background: rgba(59, 130, 246, 0.35);
        color: #ffffff;
        font-weight: 700;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preview-marker.triggered {
        animation: preview-flash 260ms ease;
      }
      @keyframes preview-flash {
        0% {
          box-shadow: 0 0 0 0 rgba(var(--preview-trigger-rgb, 56, 189, 248), 0.75);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(var(--preview-trigger-rgb, 56, 189, 248), 0.14);
          transform: scale(1.14);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(var(--preview-trigger-rgb, 56, 189, 248), 0);
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <h1>PinTap 高级设置</h1>
    <section>
      <h2>全局设置</h2>
      <div class="split">
        <div>
          <div class="row">
            <label for="markerSizePx">标识大小</label>
            <input id="markerSizePx" type="range" min="15" max="40" step="1" />
            <span class="value" id="markerSizeValue">28px</span>
          </div>
          <div class="row">
            <label for="markerBackgroundColor">标识背景颜色</label>
            <div class="color-field">
              <input class="color-picker" id="markerBackgroundColor" type="color" />
              <input class="color-input" id="markerBackgroundColorText" type="text" placeholder="#3B82F6" />
            </div>
          </div>
          <div class="row">
            <label for="markerTextColor">标识文字颜色</label>
            <div class="color-field">
              <input class="color-picker" id="markerTextColor" type="color" />
              <input class="color-input" id="markerTextColorText" type="text" placeholder="#FFFFFF" />
            </div>
          </div>
          <div class="row">
            <label for="markerOpacity">透明度</label>
            <input id="markerOpacity" type="range" min="30" max="90" step="1" />
            <span class="value" id="markerOpacityValue">80%</span>
          </div>
          <div class="row">
            <button id="saveSettings">保存全局设置</button>
          </div>
        </div>
        <div>
          <div>实时预览</div>
          <div class="preview-panel">
            <div class="preview-marker" id="previewMarker">K</div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>站点管理</h2>
      <div class="row">
        <select id="originSelect"></select>
        <button id="deleteOrigin" class="btn-danger">删除</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>键位</th>
            <th>X 轴</th>
            <th>Y 轴</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="markersBody"></tbody>
      </table>

      <h3>站点脚本</h3>
      <div class="row">
        <label for="scriptLoop">循环执行</label>
        <input id="scriptLoop" type="checkbox" />
      </div>
      <table>
        <thead>
          <tr>
            <th>步骤</th>
            <th>按钮键值</th>
            <th>等待（秒）</th>
            <th>等待偏差（秒）</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="scriptStepsBody"></tbody>
      </table>
      <div class="row">
        <button id="addScriptStep">新增步骤</button>
        <button id="saveScript">保存脚本</button>
      </div>
    </section>

    <div class="status" id="status"></div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
