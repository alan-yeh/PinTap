<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinTap Options</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e5e7eb;
      }
      h1,
      h2 {
        margin: 0 0 12px;
      }
      section {
        background: #111827;
        border: 1px solid #243045;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      label {
        min-width: 120px;
      }
      input,
      select,
      button,
      textarea {
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 6px 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid #243045;
        text-align: left;
        padding: 8px 6px;
        vertical-align: middle;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .status {
        color: #93c5fd;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>PinTap 高级设置</h1>
    <section>
      <h2>全局设置</h2>
      <div class="row">
        <label for="enabled">启用插件</label>
        <input id="enabled" type="checkbox" />
      </div>
      <div class="row">
        <label for="triggerMode">触发模式</label>
        <select id="triggerMode">
          <option value="single">按下一次</option>
          <option value="repeat">按住连发</option>
        </select>
      </div>
      <div class="row">
        <label for="repeatIntervalMs">连发间隔(ms)</label>
        <input id="repeatIntervalMs" type="number" min="50" max="1000" step="10" />
      </div>
      <div class="row">
        <button id="saveSettings">保存全局设置</button>
      </div>
    </section>

    <section>
      <h2>标识管理</h2>
      <div class="row">
        <label for="originSelect">站点 Origin</label>
        <select id="originSelect"></select>
        <button id="newOrigin">新增空站点</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>键位</th>
            <th>X 比例</th>
            <th>Y 比例</th>
            <th>半径</th>
            <th>透明度</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="markersBody"></tbody>
      </table>
      <div class="row">
        <button id="addMarker">新增标识</button>
        <button id="saveMarkers">保存当前站点标识</button>
      </div>
    </section>

    <section>
      <h2>导入 / 导出</h2>
      <div class="row">
        <button id="exportJson">导出 JSON</button>
        <button id="importJson">导入 JSON</button>
      </div>
      <textarea id="jsonArea" placeholder="导出的 JSON 会显示在这里，也可粘贴后导入"></textarea>
    </section>

    <div class="status" id="status"></div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
